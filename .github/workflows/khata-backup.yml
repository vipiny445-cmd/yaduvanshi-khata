name: Keep khata book
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Merge the live book into GitHub
        run: |
          python3 - << 'PY'
          import json, urllib.request
          from pathlib import Path
          url = "https://extendsclass.com/api/json-storage/bin/bcefcac?v=1"
          req = urllib.request.Request(url, headers={"accept": "application/json", "cache-control": "no-cache"})
          try:
              incoming = json.load(urllib.request.urlopen(req, timeout=30))
          except Exception:
              raise SystemExit(0)
          if not isinstance(incoming.get("customers"), list):
              raise SystemExit(0)
          path = Path("book.json")
          saved = json.loads(path.read_text()) if path.exists() else {"customers": []}
          def entries(rows):
              found = {}
              for row in rows or []:
                  if isinstance(row, dict) and row.get("id"):
                      found[row["id"]] = row
              return found
          people = {}
          for source in (saved.get("customers") or []), (incoming.get("customers") or []):
              for customer in source:
                  if not isinstance(customer, dict) or not customer.get("id"):
                      continue
                  previous = people.get(customer["id"])
                  if not previous:
                      people[customer["id"]] = customer
                      continue
                  merged = dict(customer)
                  both = entries(previous.get("entries"))
                  both.update(entries(customer.get("entries")))
                  merged["entries"] = list(both.values())
                  people[customer["id"]] = merged
          book = {
              "updatedAt": max(int(saved.get("updatedAt") or 0), int(incoming.get("updatedAt") or 0)),
              "shop": incoming.get("shop") or saved.get("shop"),
              "lang": "en",
              "customers": list(people.values()),
          }
          if len(book["customers"]) < len(saved.get("customers") or []):
              raise SystemExit(0)
          path.write_text(json.dumps(book, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Save
        run: |
          git config user.name "khata"
          git config user.email "khata@users.noreply.github.com"
          git add book.json
          git diff --cached --quiet || git commit -m "Keep khata book"
          git push origin gh-pages
